server {
    listen 80;
    listen [::]:80;
    server_name showcase.buxoroavto.uz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name showcase.buxoroavto.uz;
    ssl_certificate /etc/letsencrypt/live/showcase.buxoroavto.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showcase.buxoroavto.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:avtoTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/www/avto-showcase/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;
    access_log /var/log/nginx/avto-showcase.access.log;
    error_log /var/log/nginx/avto-showcase.error.log;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/avto-showcase.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(?:css|js|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
