[program:avto-showcase-worker]
process_name=%(program_name)s
directory=/var/www/avto-showcase/current
command=/usr/bin/php8.3 /var/www/avto-showcase/current/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
user=avto_showcase
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/supervisor/avto-showcase-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
umask=0027
